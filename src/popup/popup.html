<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotionSnap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <h1>NotionSnap</h1>
      <div class="header-actions">
        <button id="theme-btn" class="theme-indicator" title="切换主题">Raycast</button>
        <button id="history-btn" class="icon-btn" title="保存历史"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
        <button id="settings-btn" class="icon-btn" title="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
      </div>
    </header>

    <!-- Login screen (shown when not logged in) -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-container">
        <h2>连接到 Notion</h2>
        <p>使用 Notion 账号授权后即可开始保存</p>
        <button id="login-btn" class="login-btn">连接到 Notion</button>
      </div>
    </div>

    <!-- Main content (shown when logged in) -->
    <div id="main-content">
      <!-- 1. 内容预览（可编辑标题 + 元信息展开） -->
      <div class="content-section">
        <label class="section-label">保存内容</label>
        <div id="content-preview">
          <p class="loading">正在提取页面内容...</p>
        </div>
        <div id="metadata-extra" class="metadata-extra hidden"></div>
      </div>

      <div class="divider"></div>

      <!-- 2. 保存到 Notion 页面选择器（可搜索下拉框） -->
      <div class="save-section">
        <label class="section-label">保存到：</label>
        <div class="card">
          <div class="page-picker-trigger" id="page-picker-trigger">
            <input type="text" id="page-search" placeholder="选择或搜索目标页面..." autocomplete="off">
            <span class="page-picker-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
          </div>
        </div>
        <div id="page-picker-dropdown" class="page-picker-dropdown hidden">
          <div id="page-list" class="page-list">
            <div class="page-list-loading">加载中...</div>
          </div>
        </div>
        <input type="hidden" id="target-page" value="">
      </div>

      <!-- 预设快捷选择 -->
      <div id="presets-section" class="presets-section hidden">
        <div class="presets-header">
          <label class="section-label">选择预设</label>
          <button id="preset-add-btn" class="preset-add-btn" title="添加预设">+</button>
        </div>
        <div id="presets-row" class="presets-row"></div>
        <div id="preset-create-form" class="preset-create-form hidden">
          <input type="text" id="preset-name-input" placeholder="预设名称，如：公众号文章" maxlength="20">
          <div class="preset-create-actions">
            <button id="preset-create-cancel">取消</button>
            <button id="preset-create-save" class="preset-create-save">保存</button>
          </div>
        </div>
      </div>

      <!-- 3. 保存按钮 -->
      <button id="save-btn" class="save-btn" disabled>
        保存到 Notion
      </button>

      <!-- 4. 状态反馈 -->
      <div id="status" class="status hidden">
        <p class="status-text"></p>
      </div>

      <!-- 5. 保存成功后显示"在 Notion 中打开" -->
      <div id="open-in-notion" class="open-in-notion hidden">
        在 Notion 中打开
      </div>

      <!-- 6. 分隔线 + Workspace 选择器 -->
      <div class="divider"></div>
      <div class="workspace-section">
        <label class="section-label">空间</label>
        <div class="workspace-row">
          <div class="card workspace-picker-trigger" id="workspace-picker-trigger">
            <div class="workspace-picker-inner">
              <span id="workspace-picker-text">加载中...</span>
              <span class="workspace-picker-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
            </div>
          </div>
          <button class="icon-btn small add-ws-btn-main" title="添加空间">+</button>
        </div>
      </div>
      <div class="workspace-picker-dropdown hidden" id="workspace-picker-dropdown">
        <div id="workspace-list"></div>
      </div>
      <div class="shortcut-hint">Ctrl+Shift+S 快速保存</div>
    </div>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <button id="back-from-settings" class="settings-icon-btn" title="返回"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <h2>设置</h2>
        <button id="close-settings" class="settings-icon-btn" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="settings-body">
        <div class="workspace-manage">
          <h3>已连接的空间</h3>
          <div class="workspace-header">
            <p class="hint" style="margin:0">点击 + 按钮可授权新的 Notion 账号</p>
            <button class="settings-add-btn" title="添加空间">+</button>
          </div>
          <div id="settings-workspace-list" class="workspace-list"></div>
        </div>
        <!-- 解绑确认区域 -->
        <div class="divider dashed hidden" id="unbind-divider"></div>
        <div id="unbind-confirm" class="unbind-confirm hidden">
          <p class="unbind-confirm-text" id="unbind-confirm-text"></p>
          <div class="unbind-confirm-actions">
            <button id="unbind-confirm-cancel" class="unbind-cancel-btn">取消</button>
            <button id="unbind-confirm-ok" class="unbind-ok-btn">确认解绑</button>
          </div>
        </div>
        <div class="divider"></div>
        <div class="shortcut-section">
          <div class="shortcut-title-row">
            <h3>快捷键</h3>
            <span class="shortcut-hint-text" id="shortcut-hint">右键菜单或快捷键可直接保存，无需打开面板</span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-spacer"></span>
            <span class="shortcut-center">
              <span class="shortcut-key" id="shortcut-key">Ctrl+Shift+S</span>
              <span class="shortcut-key-default">默认 <span id="shortcut-key-default">Ctrl+Shift+S</span></span>
            </span>
            <button id="shortcut-config-btn" class="shortcut-config-btn">修改</button>
          </div>
        </div>
        <div id="settings-status" class="status hidden">
          <p class="status-text"></p>
        </div>
        <div class="divider"></div>
        <div class="divider"></div>
        <div class="presets-manage">
          <div class="presets-manage-header">
            <h3>保存预设</h3>
            <span class="hint">为常用保存目标创建快捷标签，保存时一键切换</span>
          </div>
          <div id="settings-presets-list"></div>
        </div>
        <div class="settings-footer">v0.6.2</div>
      </div>
    </div>

    <!-- 保存历史面板 -->
    <div id="history-panel" class="history-panel hidden">
      <div class="settings-header">
        <button id="back-from-history" class="settings-icon-btn" title="返回"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <h2>保存历史</h2>
        <button id="close-history" class="settings-icon-btn" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="history-body">
        <div id="history-list"></div>
      </div>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
