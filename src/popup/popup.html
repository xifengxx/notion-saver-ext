<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header>
      <h1>Notion Saver</h1>
      <div class="header-actions">
        <button id="theme-btn" class="theme-indicator" title="切换主题">Raycast</button>
        <button id="settings-btn" class="icon-btn" title="设置">⚙</button>
      </div>
    </header>

    <!-- Login screen (shown when not logged in) -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-container">
        <h2>连接到 Notion</h2>
        <p>使用 Notion 账号授权后即可开始保存</p>
        <button id="login-btn" class="login-btn">连接到 Notion</button>
      </div>
    </div>

    <!-- Main content (shown when logged in) -->
    <div id="main-content">
      <!-- Workspace info -->
      <div class="workspace-info">
        <img id="workspace-icon" class="workspace-icon-img" src="" alt="">
        <span id="workspace-name">加载中...</span>
      </div>

      <!-- 1. 内容预览（可编辑标题） -->
      <div class="content-section">
        <div id="content-preview">
          <p class="loading">正在提取页面内容...</p>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 2. 保存到 Notion 页面选择器 -->
      <div class="save-section">
        <label>保存到：</label>
        <div class="card">
          <div class="page-picker-trigger" id="page-picker-trigger">
            <span id="page-picker-label">选择目标页面...</span>
            <span class="page-picker-arrow">▾</span>
          </div>
        </div>
        <div id="page-picker-dropdown" class="page-picker-dropdown hidden">
          <div class="search-box">
            <input type="text" id="page-search" placeholder="搜索页面或数据库..." autocomplete="off">
            <span class="search-icon"></span>
          </div>
          <div id="page-list" class="page-list">
            <div class="page-list-loading">加载中...</div>
          </div>
        </div>
        <input type="hidden" id="target-page" value="">
      </div>

      <!-- 3. 保存按钮 -->
      <button id="save-btn" class="save-btn" disabled>
        保存到 Notion
      </button>

      <!-- 4. 状态反馈 -->
      <div id="status" class="status hidden">
        <p class="status-text"></p>
      </div>
    </div>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <button id="back-from-settings" class="settings-icon-btn" title="返回">‹</button>
        <h2>设置</h2>
        <button id="close-settings" class="settings-icon-btn" title="关闭">×</button>
      </div>
      <div class="settings-body">
        <div class="field">
          <label for="image-mode">图片处理方式</label>
          <select id="image-mode">
            <option value="url">使用图片 URL</option>
            <option value="base64">转为 Base64</option>
          </select>
        </div>
        <div class="divider"></div>
        <div class="logout-section">
          <button id="logout-btn" class="logout-btn">退出登录</button>
        </div>
        <div class="divider"></div>
        <div id="settings-status" class="status hidden" style="margin-top:12px">
          <p class="status-text"></p>
        </div>
        <div class="actions">
          <button id="save-settings" class="primary-btn">保存设置</button>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
