* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px;
  height: 675px;
  overflow: hidden;
  background: #0f0f1a;
  font-family: 'BricolageBold', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 1200px;
  height: 675px;
  background: linear-gradient(135deg, #1a1a2e 0%, #141428 30%, #16213e 70%, #0d0d20 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 25% 35%, rgba(233, 69, 96, 0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 65%, rgba(194, 49, 82, 0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(233, 69, 96, 0.03) 0%, transparent 75%);
  pointer-events: none;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
}

.diagonal-lines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,0.004) 2px,
    rgba(255,255,255,0.004) 4px
  );
  pointer-events: none;
}

.accent-bar-top {
  position: absolute;
  top: 0;
  left: 80px;
  right: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.5), rgba(194, 49, 82, 0.5), transparent);
}

.accent-bar-bottom {
  position: absolute;
  bottom: 0;
  left: 80px;
  right: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.25), rgba(194, 49, 82, 0.25), transparent);
}

.v-accent-l {
  position: absolute;
  left: 0;
  top: 15%;
  height: 70%;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(233, 69, 96, 0.25), transparent);
}

.v-accent-r {
  position: absolute;
  right: 0;
  top: 15%;
  height: 70%;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(194, 49, 82, 0.25), transparent);
}

.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  padding: 50px 120px;
}

.logo-wrap {
  margin-bottom: 36px;
  position: relative;
}

.logo-wrap .logo-ring {
  position: absolute;
  inset: -28px;
  border-radius: 50%;
  border: 1px solid rgba(233, 69, 96, 0.1);
}

.logo-wrap .logo-ring-outer {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  border: 1px dashed rgba(233, 69, 96, 0.06);
}

.logo-wrap img {
  width: 168px;
  height: 168px;
  display: block;
  filter: drop-shadow(0 12px 40px rgba(233, 69, 96, 0.2));
}

.tagline {
  font-family: 'BricolageBold', system-ui, sans-serif;
  font-size: 46px;
  font-weight: 700;
  color: #f0f0f5;
  letter-spacing: -0.01em;
  line-height: 1.3;
  margin-bottom: 22px;
  max-width: 820px;
  text-shadow: 0 2px 30px rgba(0,0,0,0.5);
}

.tagline .accent {
  background: linear-gradient(135deg, #e94560 0%, #ff6b81 50%, #e94560 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-family: 'GeistMono', 'SF Mono', 'Courier New', monospace;
  font-size: 16px;
  font-weight: 400;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.05em;
  margin-bottom: 40px;
}

.separator {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 36px;
}

.separator .sep-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(233, 69, 96, 0.5);
}

.separator .sep-line {
  width: 100px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.3), transparent);
}

.badges {
  display: flex;
  gap: 16px;
  align-items: center;
}

.badge {
  font-family: 'GeistMono', 'SF Mono', 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 0.07em;
  color: rgba(255,255,255,0.35);
  padding: 8px 18px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  background: rgba(255,255,255,0.02);
}

.badge.highlight {
  color: #e94560;
  border-color: rgba(233, 69, 96, 0.2);
  background: rgba(233, 69, 96, 0.05);
}

.brand-label {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'GeistMono', 'SF Mono', 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 0.09em;
  color: rgba(255,255,255,0.14);
}

.dot { position: absolute; border-radius: 50%; pointer-events: none; }
.dot-1 { width: 4px; height: 4px; background: rgba(233,69,96,0.35); top: 18%; left: 10%; }
.dot-2 { width: 3px; height: 3px; background: rgba(233,69,96,0.2); top: 28%; right: 12%; }
.dot-3 { width: 3px; height: 3px; background: rgba(194,49,82,0.25); bottom: 32%; left: 14%; }
.dot-4 { width: 4px; height: 4px; background: rgba(233,69,96,0.3); bottom: 22%; right: 10%; }
.dot-5 { width: 2px; height: 2px; background: rgba(255,107,129,0.25); top: 55%; left: 8%; }
.dot-6 { width: 2px; height: 2px; background: rgba(255,107,129,0.2); top: 50%; right: 8%; }

.corner-tl {
  position: absolute;
  top: 40px;
  left: 60px;
  width: 16px;
