  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 675px;
    overflow: hidden;
    background: #08090b;
    font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    position: relative;
    isolation: isolate;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Dot-grid texture */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgb(255 255 255 / 0.045) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  .geo-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
  }

  .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 0 80px 88px;
    position: relative;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 52px;
  }

  .logo-img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: block;
    flex-shrink: 0;
  }

  .brand-name {
    font-family: 'BricolageGrotesque', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: #f0f0f0;
    line-height: 1;
  }

  .ext-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'GeistMono', 'SF Mono', 'Cascadia Code', monospace;
    font-weight: 400;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    color: #2dd4bf;
    text-transform: uppercase;
    border: 1px solid rgb(45 212 191 / 0.32);
    border-radius: 20px;
    padding: 6px 16px;
    margin-bottom: 40px;
    width: fit-content;
  }

  .ext-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2dd4bf;
    display: block;
    flex-shrink: 0;
  }

  .headline {
    font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    font-weight: 700;
    font-size: 54px;
    line-height: 1.2;
    letter-spacing: -0.005em;
    color: #f0f0f0;
    max-width: 520px;
    margin-bottom: 28px;
  }

  .subtitle {
    font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    font-weight: 400;
    font-size: 18px;
    line-height: 1.5;
    color: rgb(255 255 255 / 0.52);
    max-width: 480px;
    letter-spacing: 0.01em;
  }

  .accent-line {
    width: 48px;
    height: 2px;
    background: #2dd4bf;
    margin-top: 38px;
    border-radius: 1px;
    opacity: 0.8;
  }

  .visual {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .footer-tag {
    position: absolute;
    bottom: 28px;
    right: 36px;
    font-family: 'GeistMono', 'SF Mono', 'Cascadia Code', monospace;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: rgb(255 255 255 / 0.22);
    z-index: 2;
  }
</style>
