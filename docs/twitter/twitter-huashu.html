<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>NotionSnap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0D0B0C;
    --text: #EAE4DB;
    --accent: #C44B4B;
    --accent-muted: rgba(196,75,75,0.25);
    --muted: #7A6E74;
    --rule: rgba(234,228,219,0.08);
  }

  body {
    width: 1200px;
    height: 675px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Depth layer — a barely-there radial glow, anti-flat without being AI-glow */
  .depth {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 90% at 75% 55%, rgba(180,100,90,0.045) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 20% 85%, rgba(180,100,90,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Rule lines — Swiss editorial grid, subtle */
  .grid-rule-h {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--rule);
    pointer-events: none;
  }
  .grid-rule-v {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }

  /* The single "120%" detail: a precise crimson geometric mark */
  .signature-mark {
    position: absolute;
    right: 100px;
    top: 192px;
    width: 50px;
    height: 4px;
    background: var(--accent);
    pointer-events: none;
  }
  .signature-mark::after {
    content: '';
    position: absolute;
    left: 54px;
    top: -6px;
    width: 4px;
    height: 16px;
    background: var(--accent);
    opacity: 0.55;
  }

  /* Card layout grid */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 52px 88px 44px 88px;
  }

  /* Top — brand signature, refined and quiet */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  .logo-img {
    width: 38px;
    height: 38px;
    border-radius: 7px;
    image-rendering: auto;
  }

  .product-name {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  .product-name em {
    font-style: normal;
    color: var(--accent);
  }

  /* Middle — the statement, large and confident */
  .statement-zone {
    display: flex;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .statement {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    font-weight: 900;
    font-size: 72px;
    line-height: 1.22;
    letter-spacing: 0.025em;
    max-width: 840px;
    text-wrap: pretty;
  }

  .statement .hl {
    color: var(--accent);
  }

  /* Bottom — supporting line, tight and informational */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
    z-index: 2;
  }

  .bottom-left {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    opacity: 0.5;
  }

  .support-line {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .support-line .sep {
    color: var(--accent-muted);
    margin: 0 7px;
  }
</style>
</head>
