<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'Bricolage';
  src: url('/Users/mac/.claude/skills/canvas-design/canvas-fonts/BricolageGrotesque-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Instrument';
  src: url('/Users/mac/.claude/skills/canvas-design/canvas-fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Instrument';
  src: url('/Users/mac/.claude/skills/canvas-design/canvas-fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 675px; overflow: hidden; }

body {
  background: radial-gradient(ellipse at 50% 30%, #1e1d25 0%, #131216 100%);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Grain texture overlay */
body::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.8;
  pointer-events: none;
  z-index: 0;
}

/* Subtle warm radial glow behind the logo area */
body::before {
  content: '';
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 520px;
  height: 280px;
  background: radial-gradient(ellipse, rgba(194,165,84,0.05) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  z-index: 1;
  padding: 0 120px;
}

/* Logo */
.logo-wrap {
  margin-bottom: 56px;
  position: relative;
}
.logo-wrap::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 17px;
  border: 1px solid rgba(255,255,255,0.05);
  pointer-events: none;
}
.logo {
  width: 72px;
  height: 72px;
  display: block;
  border-radius: 15px;
}

/* Wordmark */
.wordmark {
  font-family: 'Bricolage', 'Instrument', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  font-weight: 700;
  font-size: 60px;
  letter-spacing: -0.012em;
  color: #eee9e0;
  line-height: 1;
}

/* Thin accent underline - muted gold */
.wordmark-accent {
  width: 64px;
  height: 1.5px;
  background: #c2a554;
  opacity: 0.5;
  margin: 14px auto 32px;
}

/* Tagline */
.tagline {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 22px;
  font-weight: 400;
  color: #c4bfb3;
  letter-spacing: 0.03em;
  line-height: 1.6;
  margin-bottom: 40px;
  max-width: 580px;
}

/* Ornamental divider */
.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 40px;
}
.divider .line {
  width: 80px;
  height: 0.5px;
  background: linear-gradient(to right, transparent, rgba(200,185,155,0.4), rgba(200,185,155,0.4), transparent);
}
.divider .dot {
  width: 3px;
  height: 3px;
  background: #c9445a;
  transform: rotate(45deg);
  opacity: 0.65;
}

/* Subtitle / meta */
.meta {
  font-family: 'Instrument', "PingFang SC", sans-serif;
  font-size: 15px;
  font-weight: 400;
  color: #7a7782;
  letter-spacing: 0.05em;
}
.meta .sep {
  color: #c9445a;
  margin: 0 6px;
  opacity: 0.45;
  font-weight: 700;
}

/* Bottom accent - tiny geometric mark */
.geo-mark {
  margin-top: 68px;
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0.22;
}
.geo-mark span { display: block; }
.geo-mark .sq {
  width: 4px;
  height: 4px;
  background: #c2a554;
  transform: rotate(45deg);
}
.geo-mark .ln {
  width: 28px;
  height: 0.5px;
  background: #c2a554;
}
</style>
</head>
